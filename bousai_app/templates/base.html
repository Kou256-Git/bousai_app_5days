<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>{% block title %}防災アプリ{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --font-scale: 1;
      --primary-blue: #d8d8d8;
      --text-blue: #222;
      --button-blue: #dceaf8;
      --line-color: #999;
      --page-background: #fff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: #222;
      background: var(--page-background);
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      font-size: calc(16px * var(--font-scale));
    }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 80px;
      padding: 8px 14px;
      color: #222;
      background: var(--primary-blue);
      border: 2px solid #333;
    }

    .app-title {
      margin: 0;
      color: #222;
      font-size: calc(29px * var(--font-scale));
      font-weight: 400;
    }

    .app-title a {
      color: inherit;
      text-decoration: none;
    }

    .header-tools {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: calc(16px * var(--font-scale));
    }

    .main-nav {
      display: flex;
      gap: 25px;
      align-items: center;
      width: min(100% - 40px, 1280px);
      margin: 12px auto 0;
    }

    .main-nav a,
    .tool-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 37px;
      padding: 6px 26px;
      color: #1e2d3c;
      background: var(--button-blue);
      border: 1px solid #8493a1;
      text-decoration: none;
      white-space: nowrap;
    }

    .tool-button {
      min-height: 54px;
      padding: 6px 20px;
      color: #222;
      background: var(--button-blue);
      border-color: #8998a6;
      font-size: calc(20px * var(--font-scale));
    }

    .main-nav a:hover,
    .tool-button:hover {
      background: #c9def2;
    }

    main {
      width: min(100% - 40px, 1280px);
      margin: 20px auto 24px;
    }

    @media (max-width: 600px) {
      .app-header {
        display: block;
        padding: 12px 16px;
      }

      .app-title {
        font-size: calc(22px * var(--font-scale));
      }

      .header-tools {
        display: block;
        margin-top: 10px;
      }

      .main-nav {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        margin-top: 8px;
      }

      .header-tools {
        font-size: calc(14px * var(--font-scale));
      }

      main {
        width: min(100% - 20px, 1280px);
        margin-top: 10px;
      }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <h1 class="app-title"><a href="/">防災アプリ</a></h1>
    <div class="header-tools">
      <span>文字サイズ変更</span>
      <button id="font-size-standard" class="tool-button" type="button" aria-pressed="true">標準</button>
      <button id="font-size-large" class="tool-button" type="button" aria-pressed="false"><strong>拡大</strong></button>
      {% if session.logged_in %}
        <a class="tool-button" href="/logout">ログアウト</a>
        <span>ログイン中</span>
      {% else %}
        <a class="tool-button" href="{{ url_for('login', next=request.full_path) }}">ログイン</a>
        <span>未ログイン</span>
      {% endif %}
    </div>
  </header>

  <nav id="main-nav" class="main-nav">
    <a href="/shelter_search">避難所検索へ</a>
    {% if session.logged_in %}
      <a href="/shelter_register">避難所登録</a>
      <a href="/board">指示・発信ボード</a>
    {% endif %}
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>

  <script>
    (function() {
      const standardButton = document.getElementById('font-size-standard');
      const largeButton = document.getElementById('font-size-large');
      const savedSize = localStorage.getItem('fontSize') === 'large' ? 'large' : 'standard';

      function applyFontSize(size) {
        const isLarge = size === 'large';
        document.documentElement.style.setProperty('--font-scale', isLarge ? '1.2' : '1');
        standardButton.setAttribute('aria-pressed', String(!isLarge));
        largeButton.setAttribute('aria-pressed', String(isLarge));
        localStorage.setItem('fontSize', size);
      }

      standardButton.addEventListener('click', function() {
        applyFontSize('standard');
      });
      largeButton.addEventListener('click', function() {
        applyFontSize('large');
      });
      applyFontSize(savedSize);
    })();
  </script>
</body>
</html>
