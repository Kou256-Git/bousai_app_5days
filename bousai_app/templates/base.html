<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>{% block title %}防災アプリ{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --primary-blue: #d8d8d8;
      --text-blue: #222;
      --button-blue: #dceaf8;
      --line-color: #999;
      --page-background: #fff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: #222;
      background: var(--page-background);
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 80px;
      padding: 8px 14px;
      color: #222;
      background: var(--primary-blue);
      border: 2px solid #333;
    }

    .app-title {
      margin: 0;
      color: #222;
      font-size: 29px;
      font-weight: 400;
    }

    .header-tools {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 16px;
    }

    .main-nav {
      display: flex;
      gap: 25px;
      align-items: center;
      width: min(100% - 40px, 1280px);
      margin: 12px auto 0;
    }

    .main-nav a,
    .tool-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 37px;
      padding: 6px 26px;
      color: #1e2d3c;
      background: var(--button-blue);
      border: 1px solid #8493a1;
      text-decoration: none;
      white-space: nowrap;
    }

    .tool-button {
      min-height: 54px;
      padding: 6px 20px;
      color: #222;
      background: var(--button-blue);
      border-color: #8998a6;
      font-size: 20px;
    }

    .main-nav a:hover,
    .tool-button:hover {
      background: #c9def2;
    }

    main {
      width: min(100% - 40px, 1280px);
      margin: 20px auto 24px;
    }

    @media (max-width: 600px) {
      .app-header {
        display: block;
        padding: 12px 16px;
      }

      .app-title {
        font-size: 22px;
      }

      .header-tools {
        display: block;
        margin-top: 10px;
      }

      .main-nav {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        margin-top: 8px;
      }

      .header-tools {
        font-size: 14px;
      }

      main {
        width: min(100% - 20px, 1280px);
        margin-top: 10px;
      }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <h1 class="app-title">志賀野市防災アプリ</h1>
    <div class="header-tools">
      <span>文字サイズ変更</span>
      <button class="tool-button" type="button">標準</button>
      <button class="tool-button" type="button"><strong>拡大</strong></button>
      {% if session.logged_in %}
        <a class="tool-button" href="/logout">ログアウト</a>
        <span>ログイン中</span>
      {% else %}
        <a class="tool-button" href="/login">ログイン</a>
        <span>未ログイン</span>
      {% endif %}
    </div>
  </header>

  <nav id="main-nav" class="main-nav">
    <a href="/shelter_search">避難所検索へ</a>
    <a href="/shelter_register">避難所登録</a>
    <a href="/board">指示・発信ボード</a>
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
